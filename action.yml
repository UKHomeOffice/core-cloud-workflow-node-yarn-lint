name: Node yarn lint

inputs:
  working_directory:
    description: "Directory to run yarn lint in (default: repository root)"
    required: false
    type: string
    default: "."

  node_version:
    description: "Node version to install (e.g., 24)"
    required: false
    type: string
    default: "24"

outputs:
  yarn_lint_exit_code:
    description: "The exit code from the yarn lint command"
    value: ${{ steps.yarn_lint.outputs.exit_code }}

runs:
  using: "composite"

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'yarn'

    - name: Install Node Dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: yarn install --frozen-lockfile

    - name: Run yarn lint
      id: yarn_lint
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        yarn run lint

        EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
